services:
  postgres:
    image: postgres:16-alpine
    container_name: mms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mms_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mms} -d ${POSTGRES_DB:-mms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mms-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-mms_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mms_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  redisdata:
